<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jaga Parent App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light} body{margin:0} [hidden]{display:none!important}
:root{
  --stage:#E3EAE6; --bg:#F2F5F3; --card:#FFFFFF;
  --ink:#112B27; --ink2:#51665F; --line:rgba(17,43,39,.12); --line2:rgba(17,43,39,.24);
  --accent:#0B7A63; --accent-ink:#FFFFFF; --accent-soft:#DAF0E8; --accent-soft-ink:#075241;
  --ok-soft:#DFF1E2; --ok-ink:#1B5E2E; --warn-soft:#FBEBD0; --warn-ink:#7A4306; --bad-soft:#FADBD8; --bad-ink:#8C1D18;
  --dot-ok:#1F9D55; --dot-warn:#E0961A; --dot-bad:#D64545; --scrim:rgba(10,25,22,.5);
  --av1-bg:#DAF0E8; --av1-fg:#075241; --av2-bg:#FBEBD0; --av2-fg:#7A4306; --av3-bg:#DCEBF8; --av3-fg:#154A7C;
  --av4-bg:#F9DCE5; --av4-fg:#8A2543; --av5-bg:#E9F0D2; --av5-fg:#3F5A0E;
  --font-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#050A09; --bg:#0B1412; --card:#121E1B;
    --ink:#E5F1EC; --ink2:#9DB4AD; --line:rgba(229,241,236,.12); --line2:rgba(229,241,236,.26);
    --accent:#46C9A8; --accent-ink:#06231C; --accent-soft:#12372E; --accent-soft-ink:#A8EBD7;
    --ok-soft:#14301D; --ok-ink:#A7E3B8; --warn-soft:#3A2A0C; --warn-ink:#F3CC8B; --bad-soft:#3D1715; --bad-ink:#F4B6B1;
    --dot-ok:#4CC27F; --dot-warn:#F0B040; --dot-bad:#F06A6A; --scrim:rgba(0,0,0,.62);
    --av1-bg:#12372E; --av1-fg:#A8EBD7; --av2-bg:#3A2A0C; --av2-fg:#F3CC8B; --av3-bg:#152C44; --av3-fg:#B3D4F2;
    --av4-bg:#40182A; --av4-fg:#F4B8CB; --av5-bg:#26330C; --av5-fg:#CDE39A;
    color-scheme:dark;
  }
}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
.stage{height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{position:relative;width:100%;max-width:390px;height:100%;max-height:820px;display:flex;flex-direction:column;background:var(--bg);border-radius:32px;border:1px solid var(--line2);overflow:hidden}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 0;font-size:12px;font-weight:600}
.batt{width:22px;height:11px;border:1.5px solid var(--ink);border-radius:3px;position:relative;box-sizing:border-box}
.batt::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:12px;background:var(--ink);border-radius:1px}
.head{padding:12px 16px 0}
h1{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.01em;line-height:1.15}
.sub{font-size:13px;color:var(--ink2);margin-top:2px}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 112px;scrollbar-width:thin}
.hero{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.hero .big{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:22px;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent)}
.hero b{font-family:var(--font-display);font-size:18px;display:block}
.live{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dot-ok);flex:none}
.lede{font-size:13.5px;color:var(--ink2);margin:12px 2px 4px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:18px 2px 10px}
.ladder{display:flex;flex-direction:column}
.step,.link{display:grid;grid-template-columns:44px 1fr;column-gap:12px}
.rail{position:relative}
.step:not(.last) .rail::after{content:"";position:absolute;left:calc(50% - 1px);top:48px;bottom:0;width:2px;background:var(--line2)}
.link .rail::before{content:"";position:absolute;left:calc(50% - 1px);top:0;bottom:0;width:2px;background:var(--line2)}
.link.on .rail::before{background:var(--accent)}
.link{min-height:34px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:4px 10px;border-radius:999px;border:1px dashed var(--line2);justify-self:start;margin:4px 0}
.avatar{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:17px;flex:none}
.avatar.lg{width:52px;height:52px;font-size:20px}
.av1{background:var(--av1-bg);color:var(--av1-fg)}.av2{background:var(--av2-bg);color:var(--av2-fg)}.av3{background:var(--av3-bg);color:var(--av3-fg)}.av4{background:var(--av4-bg);color:var(--av4-fg)}.av5{background:var(--av5-bg);color:var(--av5-fg)}
.av-sec{background:var(--accent);color:var(--accent-ink)}
.num{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--font-body);font-size:11px;font-weight:600;display:grid;place-items:center;border:2px solid var(--bg)}
.mcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer}
.mcard:hover{border-color:var(--line2)}
.mrow{display:flex;align-items:center;gap:8px}
.mname{font-weight:600;flex:1;min-width:0}
.mrole{font-size:12.5px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
.state{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-alerting{background:var(--warn-soft);color:var(--warn-ink)}
.st-noanswer{background:var(--bad-soft);color:var(--bad-ink)}
.st-ack{background:var(--ok-soft);color:var(--ok-ink)}
.st-idle{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.st-fixed{color:var(--ink2);display:inline-flex}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner.warn{background:var(--warn-soft);color:var(--warn-ink)}
.banner.ok{background:var(--ok-soft);color:var(--ok-ink)}
.banner.bad{background:var(--bad-soft);color:var(--bad-ink)}
.banner p{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:14px}
.row .t span{display:block;font-size:12.5px;color:var(--ink2)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.opt{font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:var(--accent)}
.note{display:flex;gap:10px;font-size:12.5px;color:var(--ink2);margin:16px 2px 0}
.note svg{flex:none;margin-top:1px}
.empty{background:var(--card);border:1px dashed var(--line2);border-radius:16px;padding:14px;font-size:13.5px;color:var(--ink2)}
.log li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log .ico{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-soft-ink);display:grid;place-items:center;flex:none}
.log .tx{flex:1;font-size:14px}
.log time{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.bar[hidden]{display:none}
.bar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 16px;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px}
.btn{font-weight:600;font-size:14.5px;border-radius:14px;padding:12px 14px;border:1px solid var(--line2);background:var(--card);cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.bar .btn{flex:1}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:var(--bad-soft);color:var(--bad-ink);border-color:transparent}
.btn.block{width:100%}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px 22px;transform:translateY(105%);transition:transform .25s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sh-head .tt{flex:1;min-width:0}
h2{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.2}
h2:focus{outline:none}
.sh-sec{margin-top:14px}
.sh-sec h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.field{margin-top:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input[type="text"],.field input[type="tel"]{font:inherit;width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);color:var(--ink)}
.err{color:var(--bad-ink);font-size:12.5px;margin-top:4px}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13.5px}
.consent input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.kids{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none}
.kid{flex:1 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:600;font-size:14px}
.kid[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:var(--accent)}
.kid.addk{flex:0 0 auto;padding:6px 12px;border-style:dashed;color:var(--ink2)}
.kid .avatar{width:28px;height:28px;font-size:13px}
.hero.mcard{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px}
.hero .go{margin-left:auto;display:flex;align-items:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--accent)}
.maplive{margin-top:10px;font-size:15px;font-weight:500;display:flex;gap:10px;align-items:flex-start}
.maplive .dot{margin-top:7px}
.mapbox{background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.m-ground{fill:var(--bg)} .m-road{fill:var(--line2)} .m-block{fill:var(--card);stroke:var(--line2);stroke-width:1} .m-green{fill:var(--accent-soft)}
.m-txt{font:500 10px var(--font-body);fill:var(--ink2)} .m-lbl{font:600 10.5px var(--font-body);fill:var(--ink)}
.rd-off{fill:var(--card);stroke:var(--line2);stroke-width:2}
.rd-on{fill:var(--accent);stroke:var(--card);stroke-width:2}
.rd-ring{fill:none;stroke:var(--accent);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;cursor:pointer;min-height:118px}
.tile:hover{border-color:var(--line2)}
.tile .ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.tile b{display:block;font-family:var(--font-display);font-size:16px;line-height:1.2}
.tile span.s{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.t1{background:var(--av1-bg);color:var(--av1-fg)}.t2{background:var(--av3-bg);color:var(--av3-fg)}.t3{background:var(--av2-bg);color:var(--av2-fg)}.t4{background:var(--av4-bg);color:var(--av4-fg)}.t5{background:var(--av5-bg);color:var(--av5-fg)}.t6{background:var(--accent-soft);color:var(--accent-soft-ink)}
.back{display:flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;padding:4px 6px 4px 0;cursor:pointer;margin-left:-4px}
.back svg{transform:rotate(180deg)}
.badge{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.badge:first-child{border-top:0}
.badge .bi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn-ink);flex:none}
.badge.locked .bi{background:var(--bg);color:var(--ink2);border:1px dashed var(--line2)}
.badge .t{flex:1}.badge .t b{display:block;font-size:14px}.badge .t span{font-size:12.5px;color:var(--ink2)}
.bar2{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}.bar2 i{display:block;height:100%;background:var(--accent)}
.rd-row .state{margin-left:auto}
.led{background:#0A0A0A;border-radius:16px;padding:14px 16px;border:1px solid var(--line2)}
.led small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9A7A2A;margin-bottom:6px}
.led p{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;font-weight:700;letter-spacing:.06em;color:#FFB020;text-transform:uppercase;min-height:26px;word-break:break-word}
.micwrap{text-align:center;margin:18px 0 6px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;margin:0 auto}
.mic.on{background:var(--dot-bad);color:#fff;animation:micpulse 1.2s ease-in-out infinite}
@keyframes micpulse{50%{transform:scale(1.07)}}
.mhint{font-size:13px;color:var(--ink2);margin-top:10px;min-height:19px}
.mbar{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:6px}
button:focus-visible,input:focus-visible,.mcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hz-c{fill:var(--warn-soft);stroke:var(--dot-warn);stroke-width:2}
.hz-c.tmp{fill:var(--bad-soft);stroke:var(--dot-bad);stroke-dasharray:3 2}
.hzi{width:34px;height:34px;border-radius:50%;background:var(--warn-soft);color:var(--warn-ink);display:grid;place-items:center;flex:none}
.hzi.tmp{background:var(--bad-soft);color:var(--bad-ink)}
.toast{position:absolute;left:12px;right:12px;top:12px;z-index:20;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.22)}
.toast.late{border-color:var(--dot-bad)}.toast.late .ti2{background:var(--bad-soft);color:var(--bad-ink)}
.toast.hz{border-color:var(--dot-warn)}.toast.hz .ti2{background:var(--warn-soft);color:var(--warn-ink)}
.toast.info .ti2{background:var(--accent-soft);color:var(--accent-soft-ink)}
.toast b{display:block;font-size:14px}
.toast p{font-size:13px;color:var(--ink2);margin-top:2px}
.toast p.tsub{color:var(--ink);font-weight:500}
.tact{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tact .btn{padding:8px 12px;font-size:13px;border-radius:10px}
.hzg{cursor:pointer;outline:none}
.hzg:focus-visible .hz-c{stroke-width:4}
</style></head><body>
<div class="stage">
<div class="phone" id="phone">
  <div class="statusbar" aria-hidden="true"><span id="clock">3:41 pm</span><span class="batt"></span></div>
  <div id="main" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="head" id="head"></div>
    <div class="kids" id="kids"></div>
    <div class="scroll" id="scroll"></div>
  </div>
  <div class="bar" id="bar">
    <button class="btn" data-act="test" id="btn-test"></button>
    <button class="btn primary" data-act="add-open" id="btn-add"></button>
  </div>
  <div class="scrim" id="scrim" data-act="close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title"></div>
  <div class="toast" id="toast" role="alert" hidden></div>
</div>

function calculateAIRiskScore(hazard) {
  var hour = Math.floor(S.clock / 60);
  var weatherFactor = S.hz.flood ? 2 : 0;
  var historicalWeight = hazard.note ? parseInt(hazard.note) || 10 : 5;
  var velocityFactor = hazard.temp ? 6 : 2;
  
  // Simulated ML Feature Weights (Random Forest Regression Simulation)
  var rawScore = (hour >= 19 || hour <= 6 ? 28 : 10) + (weatherFactor * 12) + (historicalWeight * 1.8) + (velocityFactor * 5);
  var finalScore = Math.min(98, Math.max(8, Math.round(rawScore)));
  
  var level = finalScore > 75 ? "Critical / High Risk" : (finalScore > 45 ? "Moderate Caution" : "Low Risk");
  return { score: finalScore, level: level };
}

function lateAlert(k,r){

function setVoiceNote(t){var e=document.getElementById('v-note');if(e){e.textContent=t;}}
function updateMic(){var b=document.getElementById('v-mic');if(!b){return;}b.classList.toggle('on',S.listening);b.setAttribute('aria-label',S.listening?'Stop listening':'Tap to speak a message');if(S.listening){setVoiceNote('Listening… tap again to stop.');}}
function toggleMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setVoiceNote('Voice input is not available in this browser. Type your message instead.');return;}
  if(S.listening){stopMic();updateMic();setVoiceNote('Check the text, then tap Send to band.');return;}
  try{
    rec=new SR();rec.lang='en-MY';rec.interimResults=true;rec.continuous=false;
    rec.onresult=function(ev){var t='';for(var i=0;i<ev.results.length;i++){t+=ev.results[i][0].transcript;}var inp=document.getElementById('v-text');if(inp){inp.value=t.slice(0,40);}};
    rec.onend=function(){S.listening=false;updateMic();setVoiceNote('Check the text, then tap Send to band.');};
    rec.onerror=function(ev){S.listening=false;updateMic();setVoiceNote(ev.error==='not-allowed'||ev.error==='service-not-allowed'?'Microphone is blocked. Allow it in your browser, or type instead.':'Could not hear that. Try again or type instead.');};
    rec.start();S.listening=true;updateMic();
  }catch(x){S.listening=false;setVoiceNote('Voice input could not start. Type your message instead.');}
}
function sendVoice(){
  var k=kid(),inp=document.getElementById('v-text'),t=inp.value.replace(/^\s+|\s+$/g,'');

  k.msgs.unshift(msg);addLog('send','You sent "'+t+'" to '+k.name+"'s band");

function submitKid(){
  var name=document.getElementById('k-name').value.replace(/^\s+|\s+$/g,'');
  var age=parseInt(document.getElementById('k-age').value,10);
  var code=document.getElementById('k-code').value.replace(/^\s+|\s+$/g,'');
  var ok=true;
  showErr('ek-name',name?'':'Enter a first name');if(!name){ok=false;}
  var okAge=age>=6&&age<=12;showErr('ek-age',okAge?'':'Enter an age from 6 to 12');if(!okAge){ok=false;}
  var okCode=/^[A-Za-z]{2}-?\d{4}$/.test(code);showErr('ek-code',okCode?'':'Enter the code on the band, like JG-4821');if(!okCode){ok=false;}
  if(!ok){return;}
  var id='k'+Date.now();
  KIDS[id]={name:name,age:age,mis:[0,0,0],msgs:[],rules:[],searching:false,init:name.charAt(0).toUpperCase(),av:(Object.keys(KIDS).length%5)+1,loc:'gate',time:'just now',
    people:[{id:'you',name:'You',init:'M',rel:'Mum, primary guardian',kind:'ladder',primary:true,av:1,access:{zone:true,timeline:true,search:true},ends:'Never'}],
    log:[{ic:'plus',t:'You added '+name+' and paired the band '+code.toUpperCase(),w:'Just now'}]};
  switchKid(id);
  S.banner={kind:'ok',text:name+"'s band is paired. Add people to the circle so alerts have somewhere to go."};
  closeSheet();
}
function drawSheet(){
  var s=S.sheet,el=document.getElementById('sheet');
  if(s.kind==='member'){el.innerHTML=memberSheet(byId(s.id));}
  else if(s.kind==='security'){el.innerHTML=securitySheet();}
  else if(s.kind==='kid'){el.innerHTML=kidSheet();}
  else if(s.kind==='hazard'){el.innerHTML=hazardSheet(hzById(s.id));}
  else if(s.kind==='map'){el.innerHTML=mapSheet();}
  else if(s.kind==='live'){el.innerHTML=liveSheet();}
  else{el.innerHTML=addSheet();}
}
function closeSheet(){
  document.getElementById('scrim').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('main').inert=false;document.getElementById('bar').inert=false;
  S.sheet=null;
  render();
  if(S.lastFocus&&document.body.contains(S.lastFocus)){S.lastFocus.focus();}
}
function pressed(groupId){var b=document.querySelectorAll('#'+groupId+' .opt');for(var i=0;i<b.length;i++){if(b[i].getAttribute('aria-pressed')==='true'){return b[i].getAttribute('data-v');}}return null;}
function setPressed(groupId,v){var b=document.querySelectorAll('#'+groupId+' .opt');for(var i=0;i<b.length;i++){b[i].setAttribute('aria-pressed',b[i].getAttribute('data-v')===v);}}
function showErr(id,msg){var e=document.getElementById(id);if(msg){e.textContent=msg;e.hidden=false;}else{e.hidden=true;}}
function submitAdd(){
  var name=document.getElementById('f-name').value.replace(/^\s+|\s+$/g,'');
  var phone=document.getElementById('f-phone').value.replace(/[\s\-()]/g,'');
  var consent=document.getElementById('f-consent').checked;
  var ok=true;
  showErr('e-name',name?'':'Enter a name');if(!name){ok=false;}
  var good=/^\+?\d{9,13}$/.test(phone);
  showErr('e-phone',good?'':'Enter a mobile number like +60 12 345 6789');if(!good){ok=false;}
  showErr('e-consent',consent?'':'Confirm they know before you send the invite');if(!consent){ok=false;}
  if(!ok){return;}
  var type=pressed('g-type'),ends=pressed('g-ends');
  var p={id:'p'+Date.now(),name:name,init:name.charAt(0).toUpperCase(),rel:type==='temp'?'Temporary access':'Trusted adult',kind:type,av:(S.people.length%5)+1,access:{zone:true,timeline:false,search:false},ends:ends,pending:true};
  S.people.push(p);
  addLog('plus','You invited '+name+' to the circle');
  S.banner={kind:'ok',text:'Invite sent to '+name+'. They get alerts after they accept.'};
  closeSheet();
}
function runTest(){
  clearTimers();
  var L=ladder().filter(function(p){return !p.pending;});
  var chain=L.map(function(p){return {id:p.id,name:p.name};});chain.push({id:'security',name:'Township security'});
  var r=Math.min(1,chain.length-1);
  S.test={st:{},link:null,msg:'Test alert started. Nobody is really being alerted.',kind:'warn',done:false};
  render();
  var t=700;
  for(var i=0;i<=r;i++){
    (function(i){
      later(function(){S.test.st[chain[i].id]='alerting';S.test.link=null;S.test.msg='Test: alerting '+chain[i].name;render();},t);
      if(i<r){
        later(function(){S.test.st[chain[i].id]='noanswer';S.test.msg='Test: '+chain[i].name+' did not answer';S.test.link=ladder().indexOf(byId(chain[i].id));render();},t+1500);
      }else{
        later(function(){
          S.test.st[chain[i].id]='ack';
          for(var j=i+1;j<chain.length;j++){S.test.st[chain[j].id]='skip';}
          var secs=S.wait*60*r+25,m=Math.floor(secs/60),s=secs%60;
          S.test.link=null;S.test.kind='ok';S.test.done=true;
          S.test.msg='Test done: '+chain[i].name+' acknowledged. Alert to response: '+m+' min '+s+' s (test)';
          render();
        },t+1600);
      }
      t+=1700;
    })(i);
  }
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el){return;}
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  if(a==='go'){go(v);}
  else if(a==='back'){go('home');}
  else if(a==='search-start'){var kk=kid();kk.searching=true;addLog('search','You started a lost-child search for '+kk.name);S.banner=null;render();}
  else if(a==='search-stop'){var k2=kid();k2.searching=false;addLog('check','You marked '+k2.name+' as found and stopped the search');render();}
  else if(a==='open'){openSheet('member',el.getAttribute('data-id'));}
  else if(a==='open-sec'){openSheet('security');}
  else if(a==='add-open'){openSheet('add');}
  else if(a==='add-kid'){openSheet('kid');}
  else if(a==='submit-kid'){submitKid();}
  else if(a==='open-map'){openSheet('map');}
  else if(a==='child'){var cid=el.getAttribute('data-id');switchKid(cid);if(tripleTap(cid)){openSheet('live');}}
  else if(a==='close'){closeSheet();}
  else if(a==='wait'){S.wait=parseInt(v,10);addLog('list','You set the wait time to '+S.wait+' min');render();}
  else if(a==='global-search'){S.searchOn=!S.searchOn;addLog('list','You turned lost-child search help '+(S.searchOn?'on':'off')+' for the circle');render();}
  else if(a==='clear-banner'){S.banner=null;render();}
  else if(a==='clear-test'){clearTimers();S.test=null;render();}
  else if(a==='test'){runTest();}
  else if(a==='voice-mic'){toggleMic();}
  else if(a==='voice-quick'){var vt=document.getElementById('v-text');vt.value=v;vt.focus();}
  else if(a==='voice-send'){sendVoice();}
  else if(a==='voice-demo'){demoIncoming();}
  else if(a==='sw'){var p=byId(S.sheet.id);var k=el.getAttribute('data-k');p.access[k]=!p.access[k];addLog('list','You changed '+p.name+"'s access");drawSheet();}
  else if(a==='ends'){var q=byId(S.sheet.id);q.ends=v;q.endsLabel=null;addLog('clock','You set '+q.name+"'s access to end: "+v.toLowerCase());drawSheet();}
  else if(a==='up'||a==='down'){moveMember(a);}
  else if(a==='remove-ask'){S.sheet.confirm=true;drawSheet();}
  else if(a==='remove-no'){S.sheet.confirm=false;drawSheet();}
  else if(a==='remove-yes'){var r=byId(S.sheet.id);S.people=S.people.filter(function(x){return x.id!==r.id;});addLog('x','You removed '+r.name+' from the circle');S.banner={kind:'ok',text:r.name+' was removed and gets no more alerts.'};closeSheet();}
  else if(a==='pick-type'){setPressed('g-type',v);if(v==='temp'){setPressed('g-ends','Today');}}
  else if(a==='pick-ends'){setPressed('g-ends',v);}
  else if(a==='submit'){submitAdd();}
  else if(a==='rule-add'){var tv=document.getElementById('r-time').value,pl=document.getElementById('r-place').value;if(tv){var pm=tv.split(':'),rr={id:'r'+Date.now(),place:pl,mins:parseInt(pm[0],10)*60+parseInt(pm[1],10),state:'wait'};kid().rules.push(rr);logFor(kid(),'clock','You set '+kid().name+' to be at the '+readerById(pl).n+' by '+fmt(rr.mins));checkRules();drawSheet();}}
  else if(a==='rule-del'){kid().rules=kid().rules.filter(function(x){return x.id!==v;});drawSheet();}
  else if(a==='clock-add'){S.clock+=parseInt(v,10);tick();}
  else if(a==='clock-set'){S.clock=Math.max(S.clock,parseInt(v,10));tick();}
  else if(a==='move'){setLoc(kid(),v);}
  else if(a==='t-close'){TQ.shift();drawToast();}
  else if(a==='t-ack'){var tn=TQ[0];if(tn){tn.done=true;clearTimeout(tn.t);logFor(KIDS[tn.kidId],'check','You acknowledged the late alert for '+KIDS[tn.kidId].name);TQ.shift();drawToast();}}
  else if(a==='t-live'){var tl=TQ[0];if(tl){if(tl.kidId!==CUR){switchKid(tl.kidId);}openSheet('live');}}
  else if(a==='t-map'){var tm=TQ.shift();drawToast();if(S.sheet){closeSheet();}if(tm&&tm.kidId&&tm.kidId!==CUR){switchKid(tm.kidId);}go('map');}
  else if(a==='hz-open'){openHz(el.getAttribute('data-id'));}
  else if(a==='hz-back'){var pk=S.sheet.prev;S.sheet={kind:pk,confirm:false};drawSheet();document.getElementById('sheet').scrollTop=0;}
  else if(a==='hz-warn'){var zk=kid(),zh=hzById(S.sheet.id);(zk.msgs||(zk.msgs=[])).unshift({d:'out',text:HZB[zh.type],w:'Just now',st:'Shown on band'});logFor(zk,'send','You sent a hazard warning about "'+zh.name.toLowerCase()+'" to '+zk.name+"'s band");S.sheet.sent=true;drawSheet();}
  else if(a==='t-haz'){var th=TQ.shift();drawToast();if(th){if(th.kidId&&th.kidId!==CUR){switchKid(th.kidId);}openHz(th.hid);}}
  else if(a==='hz-sw'){var sc=document.getElementById('scroll').scrollTop;S.hz[v]=!S.hz[v];render();document.getElementById('scroll').scrollTop=sc;}
  else if(a==='daily-sw'){var sd=document.getElementById('scroll').scrollTop;S.dailyOn=!S.dailyOn;render();document.getElementById('scroll').scrollTop=sd;}
  else if(a==='daily-demo'){dailyNotice();}
});
function moveMember(dir){
  var L=ladder(),p=byId(S.sheet.id),i=L.indexOf(p),j=dir==='up'?i-1:i+1;
  if(j<1||j>=L.length){return;}
  var a=S.people.indexOf(p),b=S.people.indexOf(L[j]);
  var tmp=S.people[a];S.people[a]=S.people[b];S.people[b]=tmp;
  addLog('list','You moved '+p.name+' '+(dir==='up'?'earlier':'later')+' in the alert order');
  drawSheet();
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet){closeSheet();}if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('hzg')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
render();updateClock();
setTimeout(function(){if(S.dailyOn){dailyNotice();}},900);
</script>
</body></html>
