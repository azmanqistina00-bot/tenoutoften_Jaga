:root{color-scheme:light} body{margin:0} [hidden]{display:none!important}

}
function setVoiceNote(t){var e=document.getElementById('v-note');if(e){e.textContent=t;}}
function updateMic(){var b=document.getElementById('v-mic');if(!b){return;}b.classList.toggle('on',S.listening);b.setAttribute('aria-label',S.listening?'Stop listening':'Tap to speak a message');if(S.listening){setVoiceNote('Listening… tap again to stop.');}}
function toggleMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setVoiceNote('Voice input is not available in this browser. Type your message instead.');return;}
  if(S.listening){stopMic();updateMic();setVoiceNote('Check the text, then tap Send to band.');return;}
  try{
    rec=new SR();rec.lang='en-MY';rec.interimResults=true;rec.continuous=false;
    rec.onresult=function(ev){var t='';for(var i=0;i<ev.results.length;i++){t+=ev.results[i][0].transcript;}var inp=document.getElementById('v-text');if(inp){inp.value=t.slice(0,40);}};
    rec.onend=function(){S.listening=false;updateMic();setVoiceNote('Check the text, then tap Send to band.');};
    rec.onerror=function(ev){S.listening=false;updateMic();setVoiceNote(ev.error==='not-allowed'||ev.error==='service-not-allowed'?'Microphone is blocked. Allow it in your browser, or type instead.':'Could not hear that. Try again or type instead.');};
    rec.start();S.listening=true;updateMic();
  }catch(x){S.listening=false;setVoiceNote('Voice input could not start. Type your message instead.');}
}
function sendVoice(){
  var k=kid(),inp=document.getElementById('v-text'),t=inp.value.replace(/^\s+|\s+$/g,'');
  if(!t){setVoiceNote('Say or type a message first.');return;}
  stopMic();
  var msg={d:'out',text:t,w:'Just now',st:'Sending…'};
  k.msgs.unshift(msg);addLog('send','You sent "'+t+'" to '+k.name+"'s band");
  render();
  setTimeout(function(){msg.st='Shown on band';if(S.view==='voice'&&kid()===k){render();}},1500);
}
var DEMO_IN=['Can I stay 10 more minutes?','I am at the bus stop','I am hungry','I am home now'];
function demoIncoming(){
  var k=kid(),t=DEMO_IN[(k.msgs.length)%DEMO_IN.length];
  k.msgs.unshift({d:'in',text:t,w:'Just now'});
  addLog('mic','A voice message from '+k.name+"'s band was turned into text");
  render();
}
function renderTownship(){
  var h='<p class="lede" style="margin-top:0">These are the township readers that carry '+esc(kid().name)+"'s alerts to you.</p><p class=\"label\">Readers</p><div class=\"card\">";
  for(var i=0;i<READERS.length;i++){var r=READERS[i],weak=r.id==='minimart';h+='<div class="row rd-row"><span class="dot" style="background:var(--dot-'+(weak?'warn':'ok')+')"></span><div class="t"><b>'+esc(r.n)+'</b><span>'+(weak?'Weak signal (sample)':'Online (sample)')+'</span></div><span class="state '+(weak?'st-alerting':'st-ack')+'">'+(weak?'Check':'OK')+'</span></div>';}
  h+='</div><p class="note">'+ic('tower',16)+'<span>Route: band, then nearest reader, then guardhouse gateway, then your app.</span></p>';
  document.getElementById('scroll').innerHTML=h;
}
function render(){
  renderKids();renderHead();renderBar();
  var v=S.view;
  if(v==='home'){renderHome();}else if(v==='circle'){renderCircle();}else if(v==='map'){renderMap();}else if(v==='activity'){renderLog();}else if(v==='search'){renderSearch();}else if(v==='badges'){renderBadges();}else if(v==='voice'){renderVoice();}else{renderTownship();}
  document.getElementById('scroll').scrollTop=0;
}
function go(v){stopMic();S.view=v;S.banner=null;render();}

function sw(label,desc,key,on,locked){return '<div class="row"><div class="t"><b>'+label+'</b><span>'+desc+'</span></div><button class="switch" role="switch" aria-label="'+label+'" data-act="'+(locked?'noop':'sw')+'" data-k="'+key+'" aria-checked="'+on+'"'+(locked?' aria-disabled="true"':'')+'></button></div>';}
function memberSheet(p){
  var h='<div class="grab"></div><div class="sh-head"><div class="avatar lg av'+p.av+'">'+esc(p.init)+'</div><div class="tt"><h2 id="sh-title" tabindex="-1">'+esc(p.name)+'</h2><p class="mrole">'+esc(p.rel)+'</p></div><button class="icon-btn" data-act="close" aria-label="Close">'+ic('x',20)+'</button></div>';
  if(p.primary){
    h+='<p class="note" style="margin-top:8px">'+ic('shield',16)+'<span>You are the primary guardian. You see everything and manage the circle, so this row cannot be edited or removed.</span></p>';
    h+='<div class="actions"><button class="btn block" data-act="close">Done</button></div>';return h;
  }
  if(p.pending){h+='<div class="banner warn" style="margin-top:8px"><p>Invite pending. '+esc(p.name)+' gets alerts only after accepting.</p></div>';}
  h+='<div class="sh-sec"><h3>What they can see</h3><div class="card">';
  h+=sw('Alerts about '+kid().name,'Always on while they are in the circle','alerts',true,true);
  h+=sw('Current zone during an alert','Where the band was last heard','zone',p.access.zone,false);
  h+=sw("Today's timeline",'Crossings and zone changes from today','timeline',p.access.timeline,false);
  h+=sw('Help in a lost-child search','Only while you have a search running','search',p.access.search,false);
  h+='</div></div>';
  h+='<div class="sh-sec"><h3>Access ends</h3><div class="seg">';
  var es=['Never','Today','1 week'];for(var i=0;i<3;i++){h+='<button class="opt" data-act="ends" data-v="'+es[i]+'" aria-pressed="'+(p.ends===es[i]&&!p.endsLabel)+'">'+es[i]+'</button>';}
  h+='</div></div>';
  if(p.kind==='ladder'){
    var L=ladder(),idx=L.indexOf(p),bt='';
    if(idx>1){bt+='<button class="btn" data-act="up">'+ic('up',16)+'Alert earlier</button>';}
    if(idx<L.length-1){bt+='<button class="btn" data-act="down">'+ic('down',16)+'Alert later</button>';}
    if(bt){h+='<div class="sh-sec"><h3>Alert order</h3><div class="actions" style="margin-top:0">'+bt+'</div></div>';}
  }
  if(S.sheet.confirm){
    h+='<div class="banner bad" style="margin-top:16px"><p>Remove '+esc(p.name)+'? They will stop getting alerts about '+esc(kid().name)+' right away.</p></div><div class="actions" style="margin-top:8px"><button class="btn" data-act="remove-no">Keep</button><button class="btn danger" data-act="remove-yes">Remove</button></div>';
  }else{
    h+='<div class="actions"><button class="btn danger" data-act="remove-ask">Remove from circle</button><button class="btn" data-act="close">Done</button></div>';
  }
  return h;
}
function securitySheet(){
  return '<div class="grab"></div><div class="sh-head"><div class="avatar lg av-sec">'+ic('shield',26)+'</div><div class="tt"><h2 id="sh-title" tabindex="-1">Township security</h2><p class="mrole">Guardhouse team</p></div><button class="icon-btn" data-act="close" aria-label="Close">'+ic('x',20)+'</button></div>'+
  '<div class="sh-sec"><div class="card">'+
  '<div class="row"><div class="t"><b>When they are alerted</b><span>Only if nobody above answers in time</span></div></div>'+
  '<div class="row"><div class="t"><b>What they see</b><span>The last zone only. No timeline, no history.</span></div></div>'+
  '<div class="row"><div class="t"><b>Where they sit</b><span>Always last in the order, and cannot be moved or removed</span></div></div></div></div>'+
  '<div class="actions"><button class="btn block" data-act="close">Done</button></div>';
}
function addSheet(){
  return '<div class="grab"></div><div class="sh-head"><div class="tt"><h2 id="sh-title" tabindex="-1">Add someone</h2><p class="mrole">They get an invite and must accept first</p></div><button class="icon-btn" data-act="close" aria-label="Close">'+ic('x',20)+'</button></div>'+
  '<div class="field"><label for="f-name">Name</label><input type="text" id="f-name" autocomplete="off" placeholder="Kak Dewi"><p class="err" id="e-name" hidden></p></div>'+
  '<div class="field"><label for="f-phone">Mobile number</label><input type="tel" id="f-phone" autocomplete="off" placeholder="+60 12 345 6789"><p class="err" id="e-phone" hidden></p></div>'+
  '<div class="sh-sec"><h3>Type</h3><div class="seg" id="g-type"><button class="opt" data-act="pick-type" data-v="ladder" aria-pressed="true">Trusted adult</button><button class="opt" data-act="pick-type" data-v="temp" aria-pressed="false">Temporary</button></div></div>'+
  '<div class="sh-sec"><h3>Access ends</h3><div class="seg" id="g-ends"><button class="opt" data-act="pick-ends" data-v="Never" aria-pressed="true">Never</button><button class="opt" data-act="pick-ends" data-v="Today" aria-pressed="false">Today</button><button class="opt" data-act="pick-ends" data-v="1 week" aria-pressed="false">1 week</button></div></div>'+
  '<label class="consent"><input type="checkbox" id="f-consent"><span>They know they are being added and agree to receive alerts about '+esc(kid().name)+'.</span></label><p class="err" id="e-consent" hidden></p>'+
  '<div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="submit">Send invite</button></div>';
}
function openSheet(kind,id){
  S.lastFocus=document.activeElement;
  S.sheet={kind:kind,id:id,confirm:false};
  drawSheet();
  document.getElementById('scrim').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  document.getElementById('main').inert=true;document.getElementById('bar').inert=true;
  var t=document.getElementById('sh-title');if(t){t.focus();}
}
function mapSvg(k,cur){
  var svg='<svg viewBox="0 0 340 250" role="img" aria-label="Township map with six readers. '+esc(k.name)+' is at the '+esc(cur.n)+'."><rect class="m-ground" width="340" height="250"/>';
  svg+='<rect class="m-road" x="0" y="96" width="340" height="16"/><rect class="m-road" x="96" y="0" width="16" height="250"/><rect class="m-road" x="196" y="96" width="14" height="154"/>';
  svg+='<rect class="m-green" x="214" y="8" width="118" height="72" rx="10"/><text class="m-txt" x="222" y="74">Park</text>';
  svg+='<rect class="m-block" x="10" y="12" width="40" height="30" rx="4"/><rect class="m-block" x="56" y="12" width="32" height="30" rx="4"/><rect class="m-block" x="10" y="52" width="78" height="32" rx="4"/><rect class="m-block" x="120" y="12" width="76" height="30" rx="4"/><rect class="m-block" x="120" y="124" width="64" height="40" rx="4"/><rect class="m-block" x="120" y="172" width="64" height="30" rx="4"/><rect class="m-block" x="10" y="124" width="64" height="30" rx="4"/><rect class="m-block" x="10" y="164" width="78" height="40" rx="4"/><rect class="m-block" x="222" y="168" width="52" height="40" rx="4"/><rect class="m-block" x="280" y="168" width="50" height="40" rx="4"/><rect class="m-block" x="250" y="120" width="82" height="24" rx="4"/>';
  svg+='<text class="m-txt" x="22" y="32">Homes</text><text class="m-txt" x="32" y="72">Homes</text><text class="m-txt" x="30" y="190">Homes</text>';
  for(var i=0;i<READERS.length;i++){
    var r=READERS[i],on=r.id===k.loc;
    svg+=(on?'<circle class="rd-ring" cx="'+r.x+'" cy="'+r.y+'" r="9"/>':'')+'<circle class="'+(on?'rd-on':'rd-off')+'" cx="'+r.x+'" cy="'+r.y+'" r="'+(on?9:7)+'"/>';
    svg+='<text class="m-lbl" x="'+r.lx+'" y="'+r.ly+'" '+(on?'style="font-weight:700"':'')+'>'+esc(r.n)+'</text>';
  }
  svg+='</svg>';
  return svg;
}
function mapSheet(){
  var k=kid(),cur=readerById(k.loc),svg=mapSvg(k,cur);
  return '<div class="grab"></div><div class="sh-head"><div class="avatar lg av'+k.av+'">'+esc(k.init)+'</div><div class="tt"><h2 id="sh-title" tabindex="-1">'+esc(k.name)+'</h2><p class="mrole">Township readers near home</p></div><button class="icon-btn" data-act="close" aria-label="Close">'+ic('x',20)+'</button></div>'+
  '<div class="mapbox">'+svg+'</div>'+
  '<div class="legend"><span><i style="background:var(--accent)"></i>Child is here</span><span><i style="background:var(--card);border:2px solid var(--line2)"></i>Reader, nobody now</span></div>'+
  '<p class="maplive" role="status"><span class="dot"></span><span>'+esc(k.name)+' is at the <b>'+esc(cur.n)+'</b> as of <b>'+esc(k.time)+'</b>.</span></p>'+
  '<p class="note">'+ic('lock',16)+'<span>Sample map and times. The dot shows the reader that last heard the band, not an exact spot.</span></p>'+
  '<div class="actions"><button class="btn block" data-act="close">Done</button></div>';
}
function kidSheet(){
  return '<div class="grab"></div><div class="sh-head"><div class="tt"><h2 id="sh-title" tabindex="-1">Add a child</h2><p class="mrole">You become the primary guardian. Add the rest of the circle afterwards.</p></div><button class="icon-btn" data-act="close" aria-label="Close">'+ic('x',20)+'</button></div>'+
  '<div class="field"><label for="k-name">Child\'s first name</label><input type="text" id="k-name" autocomplete="off" placeholder="Hana"><p class="err" id="ek-name" hidden></p></div>'+
  '<div class="field"><label for="k-age">Age (6 to 12)</label><input type="tel" id="k-age" autocomplete="off" placeholder="9"><p class="err" id="ek-age" hidden></p></div>'+
  '<div class="field"><label for="k-code">Band code</label><input type="text" id="k-code" autocomplete="off" placeholder="Printed inside the band, e.g. JG-4821"><p class="err" id="ek-code" hidden></p></div>'+
  '<div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="submit-kid">Add child</button></div>';
}
function submitKid(){
  var name=document.getElementById('k-name').value.replace(/^\s+|\s+$/g,'');
  var age=parseInt(document.getElementById('k-age').value,10);
  var code=document.getElementById('k-code').value.replace(/^\s+|\s+$/g,'');
  var ok=true;
  showErr('ek-name',name?'':'Enter a first name');if(!name){ok=false;}
  var okAge=age>=6&&age<=12;showErr('ek-age',okAge?'':'Enter an age from 6 to 12');if(!okAge){ok=false;}
  var okCode=/^[A-Za-z]{2}-?\d{4}$/.test(code);showErr('ek-code',okCode?'':'Enter the code on the band, like JG-4821');if(!okCode){ok=false;}
  if(!ok){return;}
  var id='k'+Date.now();
  KIDS[id]={name:name,age:age,mis:[0,0,0],msgs:[],searching:false,init:name.charAt(0).toUpperCase(),av:(Object.keys(KIDS).length%5)+1,loc:'gate',time:'just now',
    people:[{id:'you',name:'You',init:'M',rel:'Mum, primary guardian',kind:'ladder',primary:true,av:1,access:{zone:true,timeline:true,search:true},ends:'Never'}],
    log:[{ic:'plus',t:'You added '+name+' and paired the band '+code.toUpperCase(),w:'Just now'}]};
  switchKid(id);
  S.banner={kind:'ok',text:name+"'s band is paired. Add people to the circle so alerts have somewhere to go."};
  closeSheet();
}
function drawSheet(){
  var s=S.sheet,el=document.getElementById('sheet');
  if(s.kind==='member'){el.innerHTML=memberSheet(byId(s.id));}
  else if(s.kind==='security'){el.innerHTML=securitySheet();}
  else if(s.kind==='kid'){el.innerHTML=kidSheet();}
  else if(s.kind==='map'){el.innerHTML=mapSheet();}
  else{el.innerHTML=addSheet();}
}
function closeSheet(){
  document.getElementById('scrim').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('main').inert=false;document.getElementById('bar').inert=false;
  S.sheet=null;
  render();
  if(S.lastFocus&&document.body.contains(S.lastFocus)){S.lastFocus.focus();}
}
function pressed(groupId){var b=document.querySelectorAll('#'+groupId+' .opt');for(var i=0;i<b.length;i++){if(b[i].getAttribute('aria-pressed')==='true'){return b[i].getAttribute('data-v');}}return null;}
function setPressed(groupId,v){var b=document.querySelectorAll('#'+groupId+' .opt');for(var i=0;i<b.length;i++){b[i].setAttribute('aria-pressed',b[i].getAttribute('data-v')===v);}}
function showErr(id,msg){var e=document.getElementById(id);if(msg){e.textContent=msg;e.hidden=false;}else{e.hidden=true;}}
function submitAdd(){
  var name=document.getElementById('f-name').value.replace(/^\s+|\s+$/g,'');
  var phone=document.getElementById('f-phone').value.replace(/[\s\-()]/g,'');
  var consent=document.getElementById('f-consent').checked;
  var ok=true;
  showErr('e-name',name?'':'Enter a name');if(!name){ok=false;}
  var good=/^\+?\d{9,13}$/.test(phone);
  showErr('e-phone',good?'':'Enter a mobile number like +60 12 345 6789');if(!good){ok=false;}
  showErr('e-consent',consent?'':'Confirm they know before you send the invite');if(!consent){ok=false;}
  if(!ok){return;}
  var type=pressed('g-type'),ends=pressed('g-ends');
  var p={id:'p'+Date.now(),name:name,init:name.charAt(0).toUpperCase(),rel:type==='temp'?'Temporary access':'Trusted adult',kind:type,av:(S.people.length%5)+1,access:{zone:true,timeline:false,search:false},ends:ends,pending:true};
  S.people.push(p);
  addLog('plus','You invited '+name+' to the circle');
  S.banner={kind:'ok',text:'Invite sent to '+name+'. They get alerts after they accept.'};
  closeSheet();
}
function runTest(){
  clearTimers();
  var L=ladder().filter(function(p){return !p.pending;});
  var chain=L.map(function(p){return {id:p.id,name:p.name};});chain.push({id:'security',name:'Township security'});
  var r=Math.min(1,chain.length-1);
  S.test={st:{},link:null,msg:'Test alert started. Nobody is really being alerted.',kind:'warn',done:false};
  render();
  var t=700;
  for(var i=0;i<=r;i++){
    (function(i){
      later(function(){S.test.st[chain[i].id]='alerting';S.test.link=null;S.test.msg='Test: alerting '+chain[i].name;render();},t);
      if(i<r){
        later(function(){S.test.st[chain[i].id]='noanswer';S.test.msg='Test: '+chain[i].name+' did not answer';S.test.link=ladder().indexOf(byId(chain[i].id));render();},t+1500);
      }else{
        later(function(){
          S.test.st[chain[i].id]='ack';
          for(var j=i+1;j<chain.length;j++){S.test.st[chain[j].id]='skip';}
          var secs=S.wait*60*r+25,m=Math.floor(secs/60),s=secs%60;
          S.test.link=null;S.test.kind='ok';S.test.done=true;
          S.test.msg='Test done: '+chain[i].name+' acknowledged. Alert to response: '+m+' min '+s+' s (test)';
          render();
        },t+1600);
      }
      t+=1700;
    })(i);
  }
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el){return;}
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  if(a==='go'){go(v);}
  else if(a==='back'){go('home');}
  else if(a==='search-start'){var kk=kid();kk.searching=true;addLog('search','You started a lost-child search for '+kk.name);S.banner=null;render();}
  else if(a==='search-stop'){var k2=kid();k2.searching=false;addLog('check','You marked '+k2.name+' as found and stopped the search');render();}
  else if(a==='open'){openSheet('member',el.getAttribute('data-id'));}
  else if(a==='open-sec'){openSheet('security');}
  else if(a==='add-open'){openSheet('add');}
  else if(a==='add-kid'){openSheet('kid');}
  else if(a==='submit-kid'){submitKid();}
  else if(a==='open-map'){openSheet('map');}
  else if(a==='child'){switchKid(el.getAttribute('data-id'));}
  else if(a==='close'){closeSheet();}
  else if(a==='wait'){S.wait=parseInt(v,10);addLog('list','You set the wait time to '+S.wait+' min');render();}
  else if(a==='global-search'){S.searchOn=!S.searchOn;addLog('list','You turned lost-child search help '+(S.searchOn?'on':'off')+' for the circle');render();}
  else if(a==='clear-banner'){S.banner=null;render();}
  else if(a==='clear-test'){clearTimers();S.test=null;render();}
  else if(a==='test'){runTest();}
  else if(a==='voice-mic'){toggleMic();}
  else if(a==='voice-quick'){var vt=document.getElementById('v-text');vt.value=v;vt.focus();}
  else if(a==='voice-send'){sendVoice();}
  else if(a==='voice-demo'){demoIncoming();}
  else if(a==='sw'){var p=byId(S.sheet.id);var k=el.getAttribute('data-k');p.access[k]=!p.access[k];addLog('list','You changed '+p.name+"'s access");drawSheet();}
  else if(a==='ends'){var q=byId(S.sheet.id);q.ends=v;q.endsLabel=null;addLog('clock','You set '+q.name+"'s access to end: "+v.toLowerCase());drawSheet();}
  else if(a==='up'||a==='down'){moveMember(a);}
  else if(a==='remove-ask'){S.sheet.confirm=true;drawSheet();}
  else if(a==='remove-no'){S.sheet.confirm=false;drawSheet();}
  else if(a==='remove-yes'){var r=byId(S.sheet.id);S.people=S.people.filter(function(x){return x.id!==r.id;});addLog('x','You removed '+r.name+' from the circle');S.banner={kind:'ok',text:r.name+' was removed and gets no more alerts.'};closeSheet();}
  else if(a==='pick-type'){setPressed('g-type',v);if(v==='temp'){setPressed('g-ends','Today');}}
  else if(a==='pick-ends'){setPressed('g-ends',v);}
  else if(a==='submit'){submitAdd();}
});
function moveMember(dir){
  var L=ladder(),p=byId(S.sheet.id),i=L.indexOf(p),j=dir==='up'?i-1:i+1;
  if(j<1||j>=L.length){return;}
  var a=S.people.indexOf(p),b=S.people.indexOf(L[j]);
  var tmp=S.people[a];S.people[a]=S.people[b];S.people[b]=tmp;
  addLog('list','You moved '+p.name+' '+(dir==='up'?'earlier':'later')+' in the alert order');
  drawSheet();
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet){closeSheet();}});
render();
</script>
